name: Release to QGIS Plugin Repository

on:
  push:
    tags:
      - 'v*'   # Se déclenche sur chaque tag comme v2.0.1, v3.0.0, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire la version depuis le tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Mettre à jour version dans metadata.txt
        run: sed -i "s/^version=.*/version=${{ steps.version.outputs.VERSION }}/" metadata.txt

      - name: Créer le ZIP
        run: |
          mkdir -p /tmp/ATLAS_Index_Pro
          cp -r . /tmp/ATLAS_Index_Pro/
          rm -rf /tmp/ATLAS_Index_Pro/.git
          rm -rf /tmp/ATLAS_Index_Pro/.github
          rm -rf /tmp/ATLAS_Index_Pro/__pycache__
          rm -f /tmp/ATLAS_Index_Pro/.gitignore
          rm -f /tmp/ATLAS_Index_Pro/.gitattributes
          find /tmp/ATLAS_Index_Pro -name '*.pyc' -delete
          cd /tmp
          zip -r ATLAS_Index_Pro.zip ATLAS_Index_Pro/
          echo "ZIP créé : $(du -sh ATLAS_Index_Pro.zip | cut -f1)"

      # Upload par l'API XML-RPC de plugins.qgis.org (l'ancienne URL
      # /plugins/api/v2/plugins/upload/ répondait 404). Un échec fait échouer
      # le run : pas de continue-on-error, sinon le run reste vert à tort.
      - name: Upload vers plugins.qgis.org
        env:
          OSGEO_USERNAME: ${{ secrets.OSGEO_USERNAME }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, sys, urllib.parse, xmlrpc.client
          user = os.environ.get('OSGEO_USERNAME', '')
          password = os.environ.get('OSGEO_PASSWORD', '')
          if not user or not password:
              sys.exit("::error::Secrets OSGEO_USERNAME / OSGEO_PASSWORD absents")
          url = (f"https://{urllib.parse.quote(user, safe='')}:"
                 f"{urllib.parse.quote(password, safe='')}@plugins.qgis.org/plugins/RPC2/")
          with open('/tmp/ATLAS_Index_Pro.zip', 'rb') as f:
              data = xmlrpc.client.Binary(f.read())
          try:
              result = xmlrpc.client.ServerProxy(url).plugin.upload(data)
          except xmlrpc.client.ProtocolError as e:
              sys.exit(f"::error::Upload refusé : HTTP {e.errcode} {e.errmsg}")
          except xmlrpc.client.Fault as e:
              sys.exit(f"::error::Upload refusé par le dépôt : {e.faultString}")
          print(f"Upload réussi : plugin/version {result}")
          EOF

      - name: Créer une Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/ATLAS_Index_Pro.zip
          body: |
            ## ATLAS Index Pro ${{ steps.version.outputs.VERSION }}

            Voir [CHANGELOG.md](CHANGELOG.md) pour le détail des changements.
